name: rrhh-independent
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rrhh_sipe
      POSTGRES_USER: rrhh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Supply a private PostgreSQL password}
    volumes:
      - rrhh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rrhh -d rrhh_sipe]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: ${RRHH_ENV_FILE:-.env}
    ports: ["127.0.0.1:8200:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    env_file: ${RRHH_ENV_FILE:-.env}
    command: [python, -m, app.biometric.worker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  rrhh_postgres_data:
